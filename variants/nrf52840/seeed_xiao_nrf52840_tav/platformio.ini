; TAV Networks MD1 Motion Detect Sensor
; Based on Seeed Xiao nRF52840 Sense + Wio-SX1262
[env:seeed_xiao_nrf52840_tav]
custom_meshtastic_hw_model = 88
custom_meshtastic_hw_model_slug = XIAO_NRF52_KIT
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = TAV MD1 Motion Detect Sensor
custom_meshtastic_tags = TAV

extends = nrf52840_base
board = xiao_ble_sense
board_level = extra
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/seeed_xiao_nrf52840_tav
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  -DSEEED_XIAO_NRF52840_TAV
  -DTAV_MD1_SENSOR
  -DCONFIG_NFCT_PINS_AS_GPIOS=1
  -DMESHTASTIC_EXCLUDE_SCREEN=1
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_xiao_nrf52840_tav>
debug_tool = jlink
